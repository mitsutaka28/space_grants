name: Collect awards

# 宇宙・防衛関連の政府調達を定期収集し、変更があれば collected.json をコミットする。
on:
  schedule:
    - cron: "0 21 * * *" # 毎日 21:00 UTC（日本時間 06:00）
  workflow_dispatch: {} # 手動実行も可能

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run collector
        run: node scripts/collect.mjs

      - name: Commit changes if any
        run: |
          if [ -n "$(git status --porcelain src/data/collected.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/collected.json
            git commit -m "chore: refresh auto-collected awards"
            git push
          else
            echo "No changes to commit."
          fi
